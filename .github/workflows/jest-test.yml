name: Profile API Test Cases

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run_tests:
    name: Wait for CF deploy and run Jest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v3
        with:
          version: 12.4.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Worker for isolated paid tests
        run: pnpm exec opennextjs-cloudflare build

      - name: Get deployment URL
        id: url
        uses: actions/github-script@v7
        with:
          retries: 2
          script: |
            const pr = context.payload.pull_request;
            const sha = pr?.head.sha ?? context.sha;
            const production = !pr && context.ref === 'refs/heads/main';
            const cloudflare = 'cloudflare-workers-and-pages';
            const versionUrl = /^Preview URL:[ \t]*(https:\/\/[a-z0-9-]+-profile-api\.web3bio\.workers\.dev)\/?[ \t]*$/im;

            for (let attempt = 0; attempt < 40; attempt++) {
              const { data } = await github.rest.checks.listForRef({
                ...context.repo, ref: sha, check_name: 'Workers Builds: profile-api', per_page: 10,
              });
              const build = data.check_runs.find(run => run.head_sha === sha && run.app?.slug === cloudflare);
              if (build?.status === 'completed') {
                if (build.conclusion !== 'success') {
                  throw new Error(`Cloudflare build for ${sha} finished with ${build.conclusion}: ${build.html_url}`);
                }
                const preview = build.output?.summary?.match(versionUrl)?.[1];
                const url = production ? 'https://api.web3.bio' : preview;
                if (!url) throw new Error(`Cloudflare build for ${sha} has no test URL: ${build.html_url}`);
                core.setOutput('value', url);
                core.setOutput('environment', production ? 'production' : 'staging');
                core.setOutput('graphql_server', 'https://graph.web3.bio/graphql');
                core.info(`Testing ${sha} at ${url}`);
                return;
              }
              if (attempt < 39) await new Promise(resolve => setTimeout(resolve, 15_000));
            }
            throw new Error(`Timed out waiting for the Cloudflare build of ${sha}`);

      - name: Wait and test
        env:
          BASE_URL: ${{ steps.url.outputs.value }}
          ENVIRONMENT: ${{ steps.url.outputs.environment }}
          GRAPHQL_SERVER: ${{ steps.url.outputs.graphql_server }}
          PROFILE_TEST_API_KEY: ${{ secrets.PROFILE_TEST_API_KEY || secrets.GENERAL_IDENTITY_GRAPH_API_KEY }}
          GENERAL_IDENTITY_GRAPH_API_KEY: ${{ secrets.GENERAL_IDENTITY_GRAPH_API_KEY }}
        run: |
          URL="${{ steps.url.outputs.value }}"

          echo "=========================================="
          echo "BASE_URL: $URL"
          echo "ENVIRONMENT: ${{ steps.url.outputs.environment }}"
          echo "GRAPHQL_SERVER: ${{ steps.url.outputs.graphql_server }}"
          if [ -z "${PROFILE_TEST_API_KEY}" ]; then
            echo "A valid zero-balance test key is required for preview access checks." >&2
            exit 1
          fi
          echo "=========================================="

          # Wait up to ~3 minutes for the preview to become healthy
          for i in $(seq 1 12); do
            if curl -sf --max-time 10 "$URL" > /dev/null 2>&1; then
              echo "Deployment ready, running tests..."
              node scripts/test-preview.mjs
              exit 0
            fi
            echo "Attempt $i/12: Not ready yet; sleeping 15s..."
            [ $i -lt 12 ] && sleep 15
          done

          echo "Error: Deployment not ready"
          exit 1
